# ---------------------------------------------------------------------------
# facilities:        DAY-USE permits (recreation.gov "ticket" API)
# overnight_permits: OVERNIGHT permits (recreation.gov "permits" API)
# Both sections are optional; list only what you want to watch.
#
# Shared keys:
#   dates      : dates to check (YYYY-MM-DD). A trailhead may override with its
#                own `dates:` list to narrow its window.
#   trailheads : the entries to check within the facility/permit.
#
# facilities[].facility_id   : numeric id from the URL .../ticket/300009/... -> "300009"
# facilities[].trailheads[]  : name, tour_id, url
#
# overnight_permits[].permit_id     : numeric id from .../permits/4675311 -> "4675311"
# overnight_permits[].trailheads[]  : name, division_id, url
# ---------------------------------------------------------------------------
